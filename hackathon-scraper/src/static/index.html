<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hackathon Finder — Filters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Hackathon Finder</h1>
      <p class="lead">Fresh hackathons with search, country, distance, price, participants, and date filters.</p>
    </div>
  </header>

  <main class="wrap">
    <section id="controls" class="controls" aria-label="Hackathon filters">
      <div class="filter-row filter-row-main">
        <label class="field field-wide">
          <span>Search</span>
          <input id="search" placeholder="Search title, date, country, or link..." aria-label="Search hackathons">
        </label>

        <label class="field">
          <span>Country</span>
          <select id="country">
            <option value="">All countries</option>
          </select>
        </label>

        <label class="field">
          <span>Sort</span>
          <select id="sort">
            <option value="date">Date</option>
            <option value="source">List order</option>
            <option value="alpha">Title</option>
            <option value="distance">Distance</option>
            <option value="price">Price</option>
            <option value="participants">Participants</option>
          </select>
        </label>

        <label class="field">
          <span>Direction</span>
          <select id="sortDirection">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </label>
      </div>

      <div class="filter-row">
        <label class="field checkbox-field">
          <input id="hidePast" type="checkbox" checked>
          <span>Hide past hackathons</span>
        </label>

        <label class="field checkbox-field">
          <input id="hideOnline" type="checkbox">
          <span>Hide online/global hackathons</span>
        </label>

        <label class="field">
          <span>Max distance</span>
          <input id="maxDistance" type="number" min="0" step="50" placeholder="Any km">
        </label>

        <label class="field">
          <span>Min participants</span>
          <input id="minParticipants" type="number" min="0" step="10" placeholder="Any">
        </label>

        <label class="field">
          <span>Max price</span>
          <input id="maxPrice" type="number" min="0" step="5" placeholder="Any USD">
        </label>
      </div>

      <div class="filter-row filter-row-actions">
        <button id="useLocation" class="btn" type="button">Use my location</button>
        <button id="resetFilters" class="btn btn-secondary" type="button">Reset filters</button>
        <label class="field checkbox-field compact">
          <input id="includeUnknown" type="checkbox" checked>
          <span>Include unknown country/price/participant data</span>
        </label>
        <div id="locationStatus" class="status-pill">Location not enabled</div>
        <div id="counts" class="counts">—</div>
      </div>
    </section>

    <section id="content">
      <div id="status">Loading…</div>
      <div id="grid" class="grid"></div>
      <div class="pager">
        <button id="loadMore" class="btn" type="button">Load more</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <small>Data generated by GitHub Actions. Filters infer country and distance when the source JSON does not provide exact location fields.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
